name: Phase 1/2 CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-x64:
    name: Linux x64 build and tests (Phase 1/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Bootstrap pinned vcpkg
        shell: bash
        run: |
          baseline="$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["builtin-baseline"])')"
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$baseline"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_BUILD_TYPE=Release
          -DNEXUSREV_ENABLE_SANITIZERS=ON
          -DNEXUSREV_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-x64:
    name: Windows x64 build and tests (Phase 1/2)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $baseline = python -c 'import json; print(json.load(open("vcpkg.json"))["builtin-baseline"])'
          $vcpkg = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git $vcpkg
          git -C $vcpkg checkout $baseline
          & (Join-Path $vcpkg "bootstrap-vcpkg.bat") -disableMetrics
          "VCPKG_ROOT=$vcpkg" >> $env:GITHUB_ENV
      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_BUILD_TYPE=Release
          -DNEXUSREV_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
