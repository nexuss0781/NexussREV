name: Phase 1/2/3/4/5 CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-x64:
    name: Linux x64 build and tests (Phase 1/2/3/4/5)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install report-schema test dependency
        run: python -m pip install --requirement requirements-test.txt
      - name: Bootstrap pinned vcpkg
        shell: bash
        run: |
          baseline="$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["builtin-baseline"])')"
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$baseline"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_BUILD_TYPE=Release
          -DNEXUSREV_ENABLE_SANITIZERS=ON
          -DNEXUSREV_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase4-gate4-benchmark
          path: build/phase4-benchmark-results.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase5-gate5-validation
          path: build/phase5-validation-results.json
          if-no-files-found: ignore
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - name: Benchmark MinGW toolchain
        run: >-
          python3 tests/phase2_toolchain_benchmark.py
          --mode mingw
          --program build/nexusrev
          --compiler x86_64-w64-mingw32-gcc
          --objdump x86_64-w64-mingw32-objdump
          --strip x86_64-w64-mingw32-objcopy
          --matrix tests/benchmarks/v1/toolchain-matrix.json
          --output build/phase2-toolchain-matrix/mingw.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-minGW-benchmark
          path: build/phase2-toolchain-matrix/*.json
          if-no-files-found: ignore

  windows-x64:
    name: Windows x64 build and tests (Phase 1/2/3/4/5)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install report-schema test dependency
        run: python -m pip install --requirement requirements-test.txt
      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $baseline = python -c 'import json; print(json.load(open("vcpkg.json"))["builtin-baseline"])'
          $vcpkg = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git $vcpkg
          git -C $vcpkg checkout $baseline
          & (Join-Path $vcpkg "bootstrap-vcpkg.bat") -disableMetrics
          "VCPKG_ROOT=$vcpkg" >> $env:GITHUB_ENV
      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_BUILD_TYPE=Release
          -DNEXUSREV_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase5-gate5-validation-windows
          path: build/phase5-validation-results.json
          if-no-files-found: ignore
      - name: Locate clang-cl and lld-link
        shell: pwsh
        run: |
          $llvmBin = Join-Path $env:ProgramFiles "LLVM\bin"
          $clang = Get-Command clang-cl.exe -ErrorAction SilentlyContinue
          $lld = Get-Command lld-link.exe -ErrorAction SilentlyContinue
          if (-not $clang -or -not $lld) {
            choco install llvm --yes --no-progress
          }
          if (Test-Path $llvmBin) {
            Add-Content -Path $env:GITHUB_PATH -Value $llvmBin
            $env:Path = "$llvmBin;$env:Path"
          }
          if (-not (Get-Command clang-cl.exe -ErrorAction SilentlyContinue)) { throw "clang-cl.exe unavailable" }
          if (-not (Get-Command lld-link.exe -ErrorAction SilentlyContinue)) { throw "lld-link.exe unavailable" }
          clang-cl.exe --version
          lld-link.exe --version
      - name: Resolve MSVC compiler and linker
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe unavailable" }
          $installPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) { throw "Visual Studio C++ x64 toolset unavailable" }
          $compilerItem = Get-ChildItem -Path (Join-Path $installPath "VC\Tools\MSVC\*\bin\Hostx64\x64\cl.exe") | Sort-Object FullName | Select-Object -Last 1
          if (-not $compilerItem) { throw "MSVC x64 compiler not found" }
          $compiler = $compilerItem.FullName
          $linker = Join-Path $compilerItem.DirectoryName "link.exe"
          if (-not (Test-Path $linker)) { throw "MSVC linker not found beside cl.exe" }
          "MSVC_COMPILER=$compiler" >> $env:GITHUB_ENV
          "MSVC_LINKER=$linker" >> $env:GITHUB_ENV
      - name: Benchmark MSVC toolchain
        shell: pwsh
        run: >-
          python tests/phase2_toolchain_benchmark.py
          --mode msvc
          --program build/Release/nexusrev.exe
          --compiler "$env:MSVC_COMPILER"
          --linker "$env:MSVC_LINKER"
          --matrix tests/benchmarks/v1/toolchain-matrix.json
          --output build/phase2-toolchain-matrix/msvc.json
      - name: Benchmark clang-cl toolchain
        shell: pwsh
        run: >-
          python tests/phase2_toolchain_benchmark.py
          --mode clang-cl
          --program build/Release/nexusrev.exe
          --compiler clang-cl.exe
          --linker lld-link.exe
          --matrix tests/benchmarks/v1/toolchain-matrix.json
          --output build/phase2-toolchain-matrix/clang-cl.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-windows-compiler-benchmarks
          path: build/phase2-toolchain-matrix/*.json
          if-no-files-found: ignore
