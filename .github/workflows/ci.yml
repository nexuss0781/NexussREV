name: Phase 1/2/3/4/5/6 CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-x64:
    name: Linux x64 build, tests and release hardening (Phase 1/2/3/4/5/6)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install report-schema test dependency
        run: python -m pip install --requirement requirements-test.txt
      - name: Bootstrap pinned vcpkg
        shell: bash
        run: |
          baseline="$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["builtin-baseline"])')"
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$baseline"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_BUILD_TYPE=Release
          -DNEXUSREV_ENABLE_SANITIZERS=ON
          -DNEXUSREV_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Generate SBOM and package
        shell: bash
        run: |
          python3 tools/generate_sbom.py \
            --installed-root build/vcpkg_installed \
            --ports-root "$VCPKG_ROOT/ports" \
            --platform linux-x64 \
            --output build/sbom.cdx.json
          python3 tests/sbom_smoke.py --sbom build/sbom.cdx.json --installed-root build/vcpkg_installed
          cmake --build build --target package
          archive="$(find build -maxdepth 1 -type f -name 'NexussREV-*.tar.gz' -print -quit)"
          test -n "$archive"
          python3 tests/package_smoke.py --archive "$archive" --installed-root build/vcpkg_installed --format tgz --platform linux-x64
      - name: Configure optional Zydis decoder cross-check
        run: >-
          cmake -S . -B build-zydis
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/build/vcpkg_installed"
          -DVCPKG_MANIFEST_FEATURES=decoder-crosscheck
          -DCMAKE_BUILD_TYPE=Release
          -DNEXUSREV_ENABLE_ZYDIS_CROSSCHECK=ON
          -DNEXUSREV_WARNINGS_AS_ERRORS=ON
      - name: Build and run optional Zydis decoder cross-check
        run: |
          cmake --build build-zydis --target nexusrev_decoder_crosscheck --parallel 2
          ctest --test-dir build-zydis -R '^nexusrev_decoder_crosscheck$' --output-on-failure
      - name: Build and run bounded Clang libFuzzer smoke
        shell: bash
        run: |
          CC=clang CXX=clang++ cmake -S . -B build-fuzz \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/build/vcpkg_installed/x64-linux" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DNEXUSREV_BUILD_FUZZERS=ON \
            -DNEXUSREV_WARNINGS_AS_ERRORS=OFF
          cmake --build build-fuzz --target nexusrev_phase6_fuzz --parallel 2
          mkdir -p build-fuzz/corpus
          cp tests/fuzz/corpus/* build-fuzz/corpus/
          build-fuzz/nexusrev_phase6_fuzz -seed=20261015 -runs=2000 -max_len=4096 \
            -timeout=5 -rss_limit_mb=1024 build-fuzz/corpus
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase6-linux-release
          path: |
            build/NexussREV-*.tar.gz
            build/sbom.cdx.json
            build/phase5-validation-results.json
            build/phase4-benchmark-results.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase4-gate4-benchmark
          path: build/phase4-benchmark-results.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase5-gate5-validation
          path: build/phase5-validation-results.json
          if-no-files-found: ignore
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - name: Benchmark MinGW toolchain
        run: >-
          python3 tests/phase2_toolchain_benchmark.py
          --mode mingw
          --program build/nexusrev
          --compiler x86_64-w64-mingw32-gcc
          --objdump x86_64-w64-mingw32-objdump
          --strip x86_64-w64-mingw32-objcopy
          --matrix tests/benchmarks/v1/toolchain-matrix.json
          --output build/phase2-toolchain-matrix/mingw.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-minGW-benchmark
          path: build/phase2-toolchain-matrix/*.json
          if-no-files-found: ignore

  windows-x64:
    name: Windows x64 build, tests and release hardening (Phase 1/2/3/4/5/6)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install report-schema test dependency
        run: python -m pip install --requirement requirements-test.txt
      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $baseline = python -c 'import json; print(json.load(open("vcpkg.json"))["builtin-baseline"])'
          $vcpkg = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git $vcpkg
          git -C $vcpkg checkout $baseline
          & (Join-Path $vcpkg "bootstrap-vcpkg.bat") -disableMetrics
          "VCPKG_ROOT=$vcpkg" >> $env:GITHUB_ENV
      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_BUILD_TYPE=Release
          -DNEXUSREV_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Generate SBOM and package
        shell: pwsh
        run: |
          python tools/generate_sbom.py `
            --installed-root build/vcpkg_installed `
            --ports-root "$env:VCPKG_ROOT/ports" `
            --platform windows-x64 `
            --output build/sbom.cdx.json
          python tests/sbom_smoke.py --sbom build/sbom.cdx.json --installed-root build/vcpkg_installed
          cmake --build build --config Release --target package
          $archive = Get-ChildItem build -Filter 'NexussREV-*.zip' | Select-Object -First 1
          if (-not $archive) { throw "CPack ZIP package not found" }
          python tests/package_smoke.py --archive $archive.FullName --installed-root build/vcpkg_installed --format zip --platform windows-x64
      - name: Configure optional Zydis decoder cross-check
        shell: pwsh
        run: >-
          cmake -S . -B build-zydis -A x64
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          "-DVCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/build/vcpkg_installed"
          -DVCPKG_MANIFEST_FEATURES=decoder-crosscheck
          -DCMAKE_BUILD_TYPE=Release
          -DNEXUSREV_ENABLE_ZYDIS_CROSSCHECK=ON
          -DNEXUSREV_WARNINGS_AS_ERRORS=ON
      - name: Build and run optional Zydis decoder cross-check
        shell: pwsh
        run: |
          cmake --build build-zydis --config Release --target nexusrev_decoder_crosscheck --parallel 2
          ctest --test-dir build-zydis -C Release -R '^nexusrev_decoder_crosscheck$' --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase6-windows-release
          path: |
            build/NexussREV-*.zip
            build/sbom.cdx.json
            build/phase5-validation-results.json
            build/phase4-benchmark-results.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase5-gate5-validation-windows
          path: build/phase5-validation-results.json
          if-no-files-found: ignore
      - name: Locate clang-cl and lld-link
        shell: pwsh
        run: |
          $llvmBin = Join-Path $env:ProgramFiles "LLVM\bin"
          $clang = Get-Command clang-cl.exe -ErrorAction SilentlyContinue
          $lld = Get-Command lld-link.exe -ErrorAction SilentlyContinue
          if (-not $clang -or -not $lld) {
            choco install llvm --yes --no-progress
          }
          if (Test-Path $llvmBin) {
            Add-Content -Path $env:GITHUB_PATH -Value $llvmBin
            $env:Path = "$llvmBin;$env:Path"
          }
          if (-not (Get-Command clang-cl.exe -ErrorAction SilentlyContinue)) { throw "clang-cl.exe unavailable" }
          if (-not (Get-Command lld-link.exe -ErrorAction SilentlyContinue)) { throw "lld-link.exe unavailable" }
          clang-cl.exe --version
          lld-link.exe --version
      - name: Resolve MSVC compiler and linker
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe unavailable" }
          $installPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) { throw "Visual Studio C++ x64 toolset unavailable" }
          $compilerItem = Get-ChildItem -Path (Join-Path $installPath "VC\Tools\MSVC\*\bin\Hostx64\x64\cl.exe") | Sort-Object FullName | Select-Object -Last 1
          if (-not $compilerItem) { throw "MSVC x64 compiler not found" }
          $compiler = $compilerItem.FullName
          $linker = Join-Path $compilerItem.DirectoryName "link.exe"
          if (-not (Test-Path $linker)) { throw "MSVC linker not found beside cl.exe" }
          "MSVC_COMPILER=$compiler" >> $env:GITHUB_ENV
          "MSVC_LINKER=$linker" >> $env:GITHUB_ENV
      - name: Benchmark MSVC toolchain
        shell: pwsh
        run: >-
          python tests/phase2_toolchain_benchmark.py
          --mode msvc
          --program build/Release/nexusrev.exe
          --compiler "$env:MSVC_COMPILER"
          --linker "$env:MSVC_LINKER"
          --matrix tests/benchmarks/v1/toolchain-matrix.json
          --output build/phase2-toolchain-matrix/msvc.json
      - name: Benchmark clang-cl toolchain
        shell: pwsh
        run: >-
          python tests/phase2_toolchain_benchmark.py
          --mode clang-cl
          --program build/Release/nexusrev.exe
          --compiler clang-cl.exe
          --linker lld-link.exe
          --matrix tests/benchmarks/v1/toolchain-matrix.json
          --output build/phase2-toolchain-matrix/clang-cl.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-windows-compiler-benchmarks
          path: build/phase2-toolchain-matrix/*.json
          if-no-files-found: ignore
